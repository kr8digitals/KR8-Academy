<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f2ea" />
    <script>
      /* Pre-paint theme: an explicit choice wins; otherwise the visitor's local clock (06:00–18:59 = light). */
      (function () {
        var theme = "dark";
        try {
          var stored = window.localStorage.getItem("kr8.theme.v1");
          if (stored === "light" || stored === "dark") theme = stored;
          else {
            var now = new Date();
            var hour = now.getHours() + now.getMinutes() / 60;
            theme = hour >= 6 && hour < 19 ? "light" : "dark";
          }
        } catch (e) {
          var h = new Date().getHours() + new Date().getMinutes() / 60;
          theme = h >= 6 && h < 19 ? "light" : "dark";
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "light" ? "#f7f2ea" : "#0d0015");
      })();
    </script>
